<svg xmlns="http://www.w3.org/2000/svg" width="493" height="96" viewBox="0 0 493 96" fill="none">
  <!-- Hard Cyberdeck Drop Shadow -->
  <rect x="14" y="20" width="465" height="64" rx="14" fill="#04070c" stroke="#04070c" stroke-width="4"/>
  <!-- Outer Gunmetal Armor Frame -->
  <rect x="14" y="12" width="465" height="64" rx="14" fill="#0c121d" stroke="#1e293b" stroke-width="4"/>
  <!-- Inner Neon Bezel Ring -->
  <rect x="18" y="16" width="457" height="56" rx="10" fill="#0e1624" stroke="#ff9e2c" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Corner Hex Rivets -->
  <circle cx="26" cy="24" r="2.5" fill="#090d14" stroke="#475569" stroke-width="1"/>
  <circle cx="467" cy="24" r="2.5" fill="#090d14" stroke="#475569" stroke-width="1"/>
  <circle cx="26" cy="64" r="2.5" fill="#090d14" stroke="#475569" stroke-width="1"/>
  <circle cx="467" cy="64" r="2.5" fill="#090d14" stroke="#475569" stroke-width="1"/>
  <!-- Left Tactical Reticle Diamond -->
  <g transform="translate(46 44) rotate(45)">
    <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#080c14" stroke="#ff9e2c" stroke-width="2.5"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#ff9e2c"/>
  </g>
  <!-- Micro Telemetry Code -->
  <text x="72" y="33" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#ff9e2c" letter-spacing="2">SEC-02 // VK-2019</text>
  <!-- Section Title -->
  <text x="72" y="57" font-family="Google Sans Flex, sans-serif" font-size="24" font-weight="800" fill="#e8f0f8" letter-spacing="0.5">What makes it different</text>
</svg>
