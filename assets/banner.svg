<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" fill="none">
<defs>
  <clipPath id="cardClip"><rect x="19" y="15" width="1242" height="386" rx="20"/></clipPath>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#05080f"/>
    <stop offset="55%" stop-color="#0a1220"/>
    <stop offset="100%" stop-color="#141d2f"/>
  </linearGradient>
  <linearGradient id="smogGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
    <stop offset="50%" stop-color="#ff9e2c" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ff2a6d" stop-opacity="0.14"/>
  </linearGradient>
  <linearGradient id="cyanText" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e0fbff"/>
    <stop offset="45%" stop-color="#00e5ff"/>
    <stop offset="100%" stop-color="#007799"/>
  </linearGradient>
  <linearGradient id="amberText" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff0d4"/>
    <stop offset="45%" stop-color="#ff9e2c"/>
    <stop offset="100%" stop-color="#b85300"/>
  </linearGradient>
  <linearGradient id="beamCyan" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="beamAmber" x1="1" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#ff9e2c" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#ff9e2c" stop-opacity="0.0"/>
  </linearGradient>
  <pattern id="scanlines" width="8" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="8" height="1" fill="#00e5ff" fill-opacity="0.045"/>
    <rect x="0" y="2" width="8" height="1" fill="#000000" fill-opacity="0.35"/>
  </pattern>
  <pattern id="rain" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
    <line x1="10" y1="0" x2="10" y2="28" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.16"/>
    <line x1="38" y1="22" x2="38" y2="54" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.14"/>
    <line x1="52" y1="6" x2="52" y2="24" stroke="#ff9e2c" stroke-width="0.8" stroke-opacity="0.10"/>
  </pattern>
  <pattern id="winCyan" width="12" height="10" patternUnits="userSpaceOnUse">
    <rect x="2" y="2" width="3" height="4" fill="#00e5ff" fill-opacity="0.45"/>
    <rect x="7" y="2" width="3" height="4" fill="#00e5ff" fill-opacity="0.18"/>
  </pattern>
  <pattern id="winAmber" width="14" height="10" patternUnits="userSpaceOnUse">
    <rect x="2" y="2" width="4" height="3" fill="#ff9e2c" fill-opacity="0.55"/>
    <rect x="8" y="2" width="4" height="3" fill="#ff9e2c" fill-opacity="0.22"/>
  </pattern>
</defs>

<!-- Outer Cyberdeck Chassis Shadow & Bezel -->
<rect x="14" y="22" width="1252" height="396" rx="24" fill="#030508" stroke="#030508" stroke-width="9"/>
<rect x="14" y="10" width="1252" height="396" rx="24" fill="#161f2e" stroke="#26354d" stroke-width="4"/>
<rect x="17" y="13" width="1246" height="390" rx="22" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.55"/>

<g clip-path="url(#cardClip)">
  <!-- Night Sky & Acid Rain Smog -->
  <rect x="19" y="15" width="1242" height="386" fill="url(#skyGrad)"/>
  <rect x="19" y="210" width="1242" height="191" fill="url(#smogGrad)"/>

  <!-- Spinner Searchlights -->
  <polygon points="180,401 490,15 620,15 260,401" fill="url(#beamCyan)"/>
  <polygon points="1080,401 730,15 860,15 1160,401" fill="url(#beamAmber)"/>

  <!-- Distant Tyrell Corp Megastructure Pyramids -->
  <polygon points="80,401 250,115 440,115 610,401" fill="#09101c" stroke="#1e2d44" stroke-width="2"/>
  <line x1="250" y1="115" x2="345" y2="401" stroke="#ff9e2c" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="440" y1="115" x2="345" y2="401" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.25"/>
  <polygon points="150,280 540,280 580,350 110,350" fill="url(#winAmber)" opacity="0.55"/>
  <circle cx="250" cy="115" r="4" fill="#ff2a6d"/>
  <circle cx="440" cy="115" r="4" fill="#ff2a6d"/>

  <polygon points="690,401 850,95 1030,95 1190,401" fill="#080e19" stroke="#1e2d44" stroke-width="2"/>
  <polygon points="750,240 1130,240 1170,330 710,330" fill="url(#winCyan)" opacity="0.55"/>
  <circle cx="850" cy="95" r="4" fill="#ff9e2c"/>
  <circle cx="1030" cy="95" r="4" fill="#ff9e2c"/>

  <!-- Foreground LAPD / Sector 4 Skyscraper Silhouettes -->
  <g fill="#060a12" stroke="#162234" stroke-width="1.5">
    <rect x="28" y="160" width="78" height="245"/>
    <rect x="118" y="210" width="64" height="195"/>
    <rect x="560" y="190" width="72" height="215"/>
    <rect x="642" y="235" width="58" height="170"/>
    <rect x="1115" y="150" width="84" height="255"/>
    <rect x="1208" y="200" width="55" height="205"/>
  </g>
  <rect x="36" y="175" width="62" height="190" fill="url(#winCyan)" opacity="0.75"/>
  <rect x="126" y="225" width="48" height="150" fill="url(#winAmber)" opacity="0.65"/>
  <rect x="1125" y="168" width="64" height="200" fill="url(#winAmber)" opacity="0.75"/>

  <!-- Neon Vertical Billboards -->
  <rect x="92" y="182" width="14" height="92" rx="3" fill="#0c1322" stroke="#ff2a6d" stroke-width="1.5"/>
  <line x1="99" y1="192" x2="99" y2="264" stroke="#ff2a6d" stroke-width="4" stroke-dasharray="8 6"/>
  <rect x="1100" y="185" width="14" height="105" rx="3" fill="#0c1322" stroke="#00e5ff" stroke-width="1.5"/>
  <line x1="1107" y1="196" x2="1107" y2="278" stroke="#00e5ff" stroke-width="4" stroke-dasharray="10 5"/>

  <!-- Acid Rain & CRT Scanline Overlay -->
  <rect x="19" y="15" width="1242" height="386" fill="url(#rain)"/>
  <rect x="19" y="15" width="1242" height="386" fill="url(#scanlines)"/>

  <!-- Voight-Kampff Left Optical HUD Reticle -->
  <g transform="translate(115, 110)" stroke="#00e5ff" fill="none">
    <circle cx="0" cy="0" r="46" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="8 4"/>
    <circle cx="0" cy="0" r="30" stroke-width="1.2" stroke-opacity="0.65"/>
    <circle cx="0" cy="0" r="6" fill="#ff9e2c" stroke="none"/>
    <line x1="-58" y1="0" x2="-34" y2="0" stroke-width="1.5"/>
    <line x1="34" y1="0" x2="58" y2="0" stroke-width="1.5"/>
    <line x1="0" y1="-58" x2="0" y2="-34" stroke-width="1.5"/>
    <line x1="0" y1="34" x2="0" y2="58" stroke-width="1.5"/>
  </g>

  <!-- Right Telemetry HUD Grid -->
  <g transform="translate(1035, 42)" font-family="JetBrains Mono, monospace" font-size="11" fill="#00e5ff" opacity="0.85">
    <text x="0" y="14" font-weight="700" letter-spacing="2">VK-2019 // LAPD</text>
    <text x="0" y="30" fill="#ff9e2c" letter-spacing="1.5">SECTOR 04 · BRADBURY</text>
    <text x="0" y="46" fill="#94a3b8" letter-spacing="1">34.0522° N  118.2437° W</text>
    <rect x="0" y="56" width="170" height="4" fill="#1e293b"/>
    <rect x="0" y="56" width="124" height="4" fill="#00e5ff"/>
  </g>

  <!-- Top Left Telemetry Header -->
  <g transform="translate(52, 42)" font-family="JetBrains Mono, monospace" font-size="11" fill="#00e5ff" opacity="0.85">
    <text x="0" y="14" font-weight="700" letter-spacing="2">SYS // DECKARD-DECK.OS</text>
    <text x="0" y="30" fill="#ff2a6d" letter-spacing="1.5">VOIGHT-KAMPFF EMPATHY LINK: ONLINE</text>
  </g>

  <!-- Centerpiece Cyberdeck Title Plate -->
  <g transform="translate(640, 205)">
    <!-- Armored Backing Plate -->
    <polygon points="-440,-95 415,-95 440,-70 440,85 -415,85 -440,60" fill="#080c14" fill-opacity="0.90" stroke="#1e2d44" stroke-width="3"/>
    <polygon points="-434,-89 411,-89 434,-66 434,79 -411,79 -434,56" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Corner Hex Bolts -->
    <circle cx="-420" cy="-75" r="4" fill="#1e293b" stroke="#00e5ff" stroke-width="1.2"/>
    <circle cx="405" cy="-75" r="4" fill="#1e293b" stroke="#00e5ff" stroke-width="1.2"/>
    <circle cx="-405" cy="65" r="4" fill="#1e293b" stroke="#ff9e2c" stroke-width="1.2"/>
    <circle cx="420" cy="65" r="4" fill="#1e293b" stroke="#ff9e2c" stroke-width="1.2"/>

    <!-- Top Micro Tag -->
    <rect x="-175" y="-76" width="350" height="24" rx="4" fill="#111a29" stroke="#ff9e2c" stroke-width="1.2"/>
    <text x="0" y="-60" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#ff9e2c" letter-spacing="3.5">LOS ANGELES 2019 // BLADE RUNNER</text>

    <!-- Main Title: DECKARD'S DECK -->
    <text x="4" y="16" text-anchor="middle" font-family="Google Sans Flex, JetBrains Mono, sans-serif" font-size="76" font-weight="900" fill="#020408" letter-spacing="5">DECKARD&apos;S DECK</text>
    <text x="0" y="12" text-anchor="middle" font-family="Google Sans Flex, JetBrains Mono, sans-serif" font-size="76" font-weight="900" fill="url(#cyanText)" stroke="#00e5ff" stroke-width="1" letter-spacing="5">DECKARD&apos;S DECK</text>

    <!-- Bottom Subtitle Strip -->
    <line x1="-360" y1="34" x2="360" y2="34" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.45"/>
    <text x="0" y="58" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="url(#amberText)" letter-spacing="4">FRONT-FACING VOIGHT-KAMPFF CYBERDECK SHELL · HYPRLAND + QUICKSHELL</text>
  </g>

  <!-- Bottom Telemetry Ruler -->
  <g stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1">
    <line x1="40" y1="382" x2="1240" y2="382"/>
    <line x1="200" y1="376" x2="200" y2="388"/>
    <line x1="400" y1="376" x2="400" y2="388"/>
    <line x1="640" y1="374" x2="640" y2="390" stroke="#ff9e2c" stroke-opacity="0.8" stroke-width="2"/>
    <line x1="880" y1="376" x2="880" y2="388"/>
    <line x1="1080" y1="376" x2="1080" y2="388"/>
  </g>
</g>
</svg>
